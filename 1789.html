<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OBS Lower Third - Grilla de Estrenos TV</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap');

    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Ubicación en la parte inferior izquierda */
    .lower-third {
      position: absolute;
      bottom: 40px;
      left: 40px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6);
    }

    /* Badge Superior */
    .badge {
      background: #ffffff;
      color: #6a1b9a;
      font-weight: 900;
      font-size: 0.85rem;
      text-transform: uppercase;
      padding: 5px 14px;
      letter-spacing: 2px;
      width: fit-content;
    }

    /* Estructura de Grilla */
    .grid-container {
      background: #6a1b9a;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(3, 230px);
      gap: 12px;
      box-sizing: border-box;
      opacity: 1;
      transition: opacity 0.5s ease-in-out;
    }

    /* Tarjeta individual de estreno */
    .card {
      background: rgba(0, 0, 0, 0.25);
      border-left: 4px solid #ffffff;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .channel {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      background: #ffffff;
      color: #6a1b9a;
      padding: 2px 6px;
      border-radius: 2px;
    }

    .date {
      font-size: 0.75rem;
      font-weight: 500;
      color: #e1bee7;
    }

    .show-title {
      font-size: 1.05rem;
      font-weight: 900;
      color: #ffffff;
      margin: 4px 0;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .time {
      font-size: 0.85rem;
      font-weight: 700;
      color: #ffd54f; /* Tono dorado para resaltar el horario */
      margin-top: 4px;
    }

    .fade-out {
      opacity: 0;
    }
  </style>
</head>
<body>

  <div class="lower-third">
    <div class="badge">Próximos Estrenos TV</div>
    <div class="grid-container" id="grid">
      <!-- Las tarjetas se generan dinámicamente -->
    </div>
  </div>

  <script>
    // Base de datos de estrenos (se puede sustituir por un endpoint API)
    let premiereBatches = [
      [
        { show: "Gran Hermano", channel: "Telefe", date: "HOY", time: "22:30 HS" },
        { show: "Los Los 8 Escalones", channel: "Eltrece", date: "MAÑANA", time: "21:15 HS" },
        { show: "MasterChef Celebrity", channel: "Telefe", date: "DOMINGO", time: "22:00 HS" }
      ],
      [
        { show: "Bailando por un Sueño", channel: "América", date: "LUNES", time: "21:45 HS" },
        { show: "Periodismo Para Todos", channel: "Eltrece", date: "DOMINGO", time: "22:00 HS" },
        { show: "PH: Podemos Hablar", channel: "Telefe", date: "SÁBADO", time: "22:15 HS" }
      ],
      [
        { show: "Bendita TV", channel: "El Nueve", date: "HOY", time: "20:30 HS" },
        { show: "LAM", channel: "América", date: "HOY", time: "20:00 HS" },
        { show: "Cine AFA: La Película", channel: "TV Pública", date: "VIERNES", time: "21:00 HS" }
      ]
    ];

    let currentBatchIndex = 0;

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.classList.add('fade-out');

      setTimeout(() => {
        grid.innerHTML = '';
        const currentBatch = premiereBatches[currentBatchIndex];

        currentBatch.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-header">
              <span class="channel">${item.channel}</span>
              <span class="date">${item.date}</span>
            </div>
            <div class="show-title">${item.show}</div>
            <div class="time">⏰ ${item.time}</div>
          `;
          grid.appendChild(card);
        });

        grid.classList.remove('fade-out');
        currentBatchIndex = (currentBatchIndex + 1) % premiereBatches.length;
      }, 500);
    }

    // Simula la actualización remota de datos cada 2 horas
    function fetchNewPremieres() {
      console.log("Actualizando lista de estrenos...");
      // Aquí se conectaría con tu servidor/API para renovar la lista
    }

    // Inicialización
    renderGrid();

    // Rotar la tanda de 3 programas en pantalla cada 12 segundos
    setInterval(renderGrid, 12000);

    // Actualizar datos del servidor cada 2 horas (7.200.000 ms)
    setInterval(fetchNewPremieres, 2 * 60 * 60 * 1000);
  </script>

</body>
</html>
