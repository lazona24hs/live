<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OBS Lower Third - Noticias con Descripción</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');

    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Ubicación en la esquina inferior izquierda */
    .lower-third {
      position: absolute;
      bottom: 40px;
      left: 40px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    /* Etiqueta / Encabezado */
    .badge {
      background: #ffffff;
      color: #6a1b9a;
      font-weight: 800;
      font-size: 0.85rem;
      text-transform: uppercase;
      padding: 4px 12px;
      letter-spacing: 1.5px;
      width: fit-content;
    }

    /* Contenedor principal rectangular violeta */
    .content-box {
      background: #6a1b9a;
      color: #ffffff;
      padding: 14px 20px;
      width: 650px;
      box-sizing: border-box;
      opacity: 1;
      transition: opacity 0.4s ease-in-out;
    }

    /* Titular destacado */
    .title {
      font-size: 1.15rem;
      font-weight: 800;
      margin: 0 0 6px 0;
      line-height: 1.25;
      color: #ffffff;
    }

    /* Descripción corta */
    .description {
      font-size: 0.88rem;
      font-weight: 400;
      margin: 0;
      line-height: 1.35;
      color: #e1bee7; /* Violeta claro para diferenciarse del título */
      display: -webkit-box;
      -webkit-line-clamp: 2; /* Limita la descripción a un máximo de 2 líneas */
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .fade-out {
      opacity: 0;
    }
  </style>
</head>
<body>

  <div class="lower-third">
    <div class="badge">Últimas Noticias</div>
    <div class="content-box" id="content-box">
      <h1 class="title" id="title">Cargando noticias...</h1>
      <p class="description" id="description"></p>
    </div>
  </div>

  <script>
    const RSS_URL = 'https://api.rss2json.com/v1/api.json?rss_url=https://www.clarin.com/rss/lo-ultimo/';
    
    let newsList = [];
    let currentIndex = 0;

    // Función auxiliar para quitar etiquetas HTML del texto de descripción
    function cleanHTML(htmlString) {
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = htmlString;
      return tempDiv.textContent || tempDiv.innerText || '';
    }

    // Obtener las noticias desde el feed
    async function fetchNews() {
      try {
        const response = await fetch(RSS_URL);
        if (!response.ok) throw new Error('Error al obtener noticias');
        
        const data = await response.json();
        if (data.items && data.items.length > 0) {
          newsList = data.items.map(item => ({
            title: item.title,
            description: cleanHTML(item.description || item.content || '')
          }));
          currentIndex = 0;
          displayNextNews();
        }
      } catch (error) {
        console.error('Error cargando noticias:', error);
        document.getElementById('title').textContent = 'No se pudieron cargar las noticias';
      }
    }

    // Mostrar el titular y su descripción con animación
    function displayNextNews() {
      if (newsList.length === 0) return;

      const contentBox = document.getElementById('content-box');
      const titleElem = document.getElementById('title');
      const descElem = document.getElementById('description');

      // Animación de salida (fade-out)
      contentBox.classList.add('fade-out');

      setTimeout(() => {
        const currentItem = newsList[currentIndex];
        
        titleElem.textContent = currentItem.title;
        descElem.textContent = currentItem.description;

        // Animación de entrada (fade-in)
        contentBox.classList.remove('fade-out');

        // Pasar a la siguiente noticia
        currentIndex = (currentIndex + 1) % newsList.length;
      }, 400);
    }

    // Inicializar carga de noticias
    fetchNews();

    // Rotar cada noticia completa cada 12 segundos para dar tiempo a leer la descripción
    setInterval(displayNextNews, 12000);

    // Actualizar el feed de noticias en segundo plano cada 2 horas
    setInterval(fetchNews, 2 * 60 * 60 * 1000);
  </script>

</body>
</html>
