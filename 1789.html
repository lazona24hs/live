<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OBS Lower Third - Noticias</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap');

    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Ubicación en la esquina inferior izquierda */
    .lower-third {
      position: absolute;
      bottom: 40px;
      left: 40px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    /* Etiqueta / Encabezado */
    .badge {
      background: #ffffff;
      color: #6a1b9a;
      font-weight: 800;
      font-size: 0.85rem;
      text-transform: uppercase;
      padding: 4px 12px;
      letter-spacing: 1.5px;
      width: fit-content;
    }

    /* Contenedor principal rígido */
    .content-box {
      background: #6a1b9a;
      color: #ffffff;
      padding: 12px 24px;
      width: 650px; /* Ancho fijo para mantener la forma del overlay */
      overflow: hidden; /* Oculta el texto fuera del área visible */
      white-space: nowrap;
      position: relative;
    }

    /* Texto de la noticia */
    .headline {
      display: inline-block;
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0;
      opacity: 1;
      transition: opacity 0.4s ease-in-out;
      will-change: transform;
    }

    .fade-out {
      opacity: 0;
    }
  </style>
</head>
<body>

  <div class="lower-third">
    <div class="badge">Últimas Noticias</div>
    <div class="content-box" id="content-box">
      <span class="headline" id="headline">Cargando noticias...</span>
    </div>
  </div>

  <script>
    // URL del feed RSS convertida a JSON
    const RSS_URL = 'https://api.rss2json.com/v1/api.json?rss_url=https://www.clarin.com/rss/lo-ultimo/';
    
    let newsList = [];
    let currentIndex = 0;
    let rotationTimer = null;

    // Obtener las noticias desde el feed
    async function fetchNews() {
      try {
        const response = await fetch(RSS_URL);
        if (!response.ok) throw new Error('Error al obtener noticias');
        
        const data = await response.json();
        if (data.items && data.items.length > 0) {
          newsList = data.items.map(item => item.title);
          currentIndex = 0;
          displayNextNews();
        }
      } catch (error) {
        console.error('Error cargando noticias:', error);
        document.getElementById('headline').textContent = 'No se pudieron cargar las noticias';
      }
    }

    // Rotar al siguiente titular y animar desplazamiento si es largo
    function displayNextNews() {
      if (newsList.length === 0) return;

      const headline = document.getElementById('headline');
      const box = document.getElementById('content-box');

      // Detener cualquier temporizador activo previo
      if (rotationTimer) clearTimeout(rotationTimer);

      // Desvanecer el texto anterior
      headline.classList.add('fade-out');

      setTimeout(() => {
        // Limpiar animaciones CSS previas
        headline.style.animation = 'none';
        headline.style.transform = 'translateX(0)';

        // Cambiar el texto de la noticia
        headline.textContent = newsList[currentIndex];
        headline.classList.remove('fade-out');

        // Calcular si el texto sobrepasa el ancho de la caja
        const textWidth = headline.offsetWidth;
        const boxWidth = box.clientWidth - 48; // Descontamos paddings (24px + 24px)

        let displayDuration = 8000; // Tiempo por defecto si la noticia entra entera (8s)

        if (textWidth > boxWidth) {
          const overflowDistance = textWidth - boxWidth;
          // Asigna velocidad de desplazamiento proporcional a la longitud
          const scrollDuration = Math.max(5, overflowDistance / 35); 
          
          // Crear la animación de marquesina en tiempo real
          headline.style.animation = `scrollText ${scrollDuration}s linear 1.5s forwards`;
          
          // Tiempo total visible: Pausa inicial (1.5s) + Desplazamiento + Pausa final (2s)
          displayDuration = (1.5 + scrollDuration + 2) * 1000;
        }

        // Pasar al siguiente titular
        currentIndex = (currentIndex + 1) % newsList.length;

        // Programar la siguiente noticia
        rotationTimer = setTimeout(displayNextNews, displayDuration);
      }, 400);
    }

    // Insertar estilos dinámicos para el scroll en la página
    const styleSheet = document.createElement("style");
    styleSheet.textContent = `
      @keyframes scrollText {
        0% { transform: translateX(0); }
        100% { transform: translateX(calc(-100% + ${650 - 48}px)); }
      }
    `;
    document.head.appendChild(styleSheet);

    // Inicializar carga de noticias
    fetchNews();

    // Actualizar noticias nuevas desde internet cada 2 horas
    setInterval(fetchNews, 2 * 60 * 60 * 1000);
  </script>

</body>
</html>
