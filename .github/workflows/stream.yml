name: Stream 24/7 a Cloudflare R2

on:
  schedule:
    # Reinicia el proceso cada 5 horas para evitar el límite de tiempo de GitHub (max 6h)
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-boot: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar FFmpeg y rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone

      - name: Configurar rclone para R2
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Other
          env_auth = false
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          s3_force_path_style = true
          EOF

      - name: Generar lista de reproducción
        run: |
          # Genera un archivo lista.txt leyendo todos los .mp4 del repo
          for f in *.mp4; do echo "file '$f'" >> lista.txt; done

      - name: Transmitir y Sincronizar en tiempo real
        run: |
          mkdir -p /tmp/hls
          
          # Inicia rclone en segundo plano para subir los segmentos a R2 continuamente
          rclone sync /tmp/hls r2:${{ secrets.R2_BUCKET }} --realtime-delay 1s --poll-interval 2s &
          
          # Ejecuta FFmpeg para codificar el HLS
          ffmpeg -re -f concat -safe 0 -i lista.txt -stream_loop -1 \
            -c:v libx264 -preset ultrafast -b:v 2000k -g 60 \
            -c:a aac -b:a 128k -ar 44100 \
            -f hls -hls_time 4 -hls_list_size 6 \
            -hls_flags delete_segments /tmp/hls/live.m3u8
