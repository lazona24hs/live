name: Transmisión canala03j

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  canala03j:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg rclone
      - run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Other
          env_auth = false
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          s3_force_path_style = true
          EOF
      - run: |
          mkdir -p /tmp/hls_a03j
          while true; do
            rclone sync /tmp/hls_a03j r2:${{ secrets.R2_BUCKET }}
            sleep 2
          done &
          ffmpeg -re -i "http://181.209.38.115:8000/play/a03j/index.m3u8" \
            -c copy \
            -f hls -hls_time 4 -hls_list_size 6 \
            -hls_flags delete_segments /tmp/hls_a03j/canala03j.m3u8
