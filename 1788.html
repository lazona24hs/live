<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OBS Overlay - Reloj y Clima</title>
  <style>
    /* Importamos una fuente limpia de estilo digital/moderno */
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      background-color: transparent; /* Fondo transparente para OBS */
      font-family: 'Montserrat', sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    .overlay-container {
      display: inline-flex;
      align-items: center;
      gap: 15px;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.65); /* Fondo semitransparente estilo HUD */
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .clock {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .divider {
      width: 2px;
      height: 25px;
      background-color: rgba(255, 255, 255, 0.3);
    }

    .weather {
      font-size: 1.5rem;
      font-weight: 500;
      color: #4da6ff; /* Accent de color para la temperatura */
    }
  </style>
</head>
<body>

  <div class="overlay-container">
    <div class="clock" id="clock">00:00</div>
    <div class="divider"></div>
    <div class="weather" id="weather">-- °C</div>
  </div>

  <script>
    // Configura tus coordenadas geográficas (Por defecto: Rosario, Santa Fe, Argentina)
    const LATITUDE = -32.9468;
    const LONGITUDE = -60.6393;

    // Actualizador del Reloj forzado a la hora oficial de Argentina (UTC-3)
    function updateClock() {
      const now = new Date();
      
      const formatter = new Intl.DateTimeFormat('es-AR', {
        timeZone: 'America/Argentina/Buenos_Aires',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });

      document.getElementById('clock').textContent = formatter.format(now);
    }

    // Consulta de temperatura usando Open-Meteo (Sin API Key)
    async function updateWeather() {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&current=temperature_2m`;
      
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Error al conectar con el servicio del clima');
        
        const data = await response.json();
        const temp = Math.round(data.current.temperature_2m);
        document.getElementById('weather').textContent = `${temp} °C`;
      } catch (error) {
        console.error('Error obteniendo el clima:', error);
      }
    }

    // Inicialización del reloj (actualiza cada segundo para sincronización exacta)
    updateClock();
    setInterval(updateClock, 1000);

    // Inicialización del clima (cada 2 horas = 7,200,000 milisegundos)
    updateWeather();
    setInterval(updateWeather, 2 * 60 * 60 * 1000);
  </script>

</body>
</html>
