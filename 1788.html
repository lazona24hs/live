<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OBS Overlay - Lower Third Canal de Noticias (Ticker Clima Dinámico)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,700;0,900;1,800;1,900&display=swap');

    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      width: 1920px;
      height: 1080px;
    }

    /* CONTENEDOR PRINCIPAL 16:9 */
    .overlay-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
    }

    /* BARRA SUPERIOR (MARGEN SEGURO 4:3) */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      padding-right: 280px;
      padding-top: 20px;
      box-sizing: border-box;
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      padding: 10px 20px;
      background: linear-gradient(-45deg, #4a148c, #6a1b9a, #8e24aa, #ab47bc, #4a148c);
      background-size: 300% 300%;
      animation: gradientShift 8s ease infinite;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .logo-box {
      background-color: #000000;
      padding: 6px 14px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo-e {
      font-size: 1.8rem;
      font-weight: 900;
      font-style: italic;
      color: #ffffff;
      line-height: 1;
    }

    .play-icon {
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 13px solid #6a1b9a;
      display: inline-block;
      margin: 0 2px;
    }

    .logo-radio {
      font-size: 1.8rem;
      font-weight: 900;
      font-style: italic;
      color: #6a1b9a;
      line-height: 1;
    }

    /* LOWER THIRD NEWS STYLE */
    .news-lower-third {
      width: 100%;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.6);
    }

    /* FILA 1: PROGRAMA ("ESTÁS VIENDO") */
    .news-headline-bar {
      display: flex;
      align-items: stretch;
      background: rgba(15, 15, 15, 0.95);
      height: 48px;
      padding-left: 280px;
      box-sizing: border-box;
    }

    .news-badge {
      background: #d32f2f;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 900;
      text-transform: uppercase;
      padding: 0 25px;
      display: flex;
      align-items: center;
      letter-spacing: 1px;
      box-shadow: 4px 0 10px rgba(0,0,0,0.3);
      z-index: 2;
    }

    .news-program-title {
      color: #ffffff;
      font-size: 1.3rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      padding: 0 20px;
      letter-spacing: 0.5px;
    }

    /* FILA 2: TICKER + CLIMA Y HORA */
    .news-ticker-bar {
      display: flex;
      align-items: stretch;
      background: #000000;
      border-top: 2px solid #d32f2f;
      height: 42px;
      padding-right: 280px;
      box-sizing: border-box;
    }

    .ticker-container {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      display: flex;
      align-items: center;
    }

    .ticker-content {
      display: flex;
      white-space: nowrap;
      animation: ticker-loop 35s linear infinite;
    }

    .ticker-item {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
      padding-right: 60px;
    }

    .highlight {
      color: #ff4081;
    }

    .weather-highlight {
      color: #4fc3f7;
    }

    /* WIDGETS FIJOS (HORA + CLIMA ACTUAL) */
    .news-widgets {
      display: flex;
      align-items: center;
      background: #1a1a1a;
      z-index: 2;
      box-shadow: -4px 0 10px rgba(0,0,0,0.4);
    }

    .clock-box {
      background: #6a1b9a;
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: 900;
      padding: 0 18px;
      height: 100%;
      display: flex;
      align-items: center;
      letter-spacing: 1px;
    }

    .weather-box {
      background: #121212;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 0 18px;
      height: 100%;
      display: flex;
      align-items: center;
      border-left: 1px solid #333;
    }

    @keyframes ticker-loop {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }
  </style>
</head>
<body>

  <div class="overlay-wrapper">
    <!-- ARRIBA A LA DERECHA: LOGO -->
    <div class="top-bar">
      <div class="logo-container">
        <div class="logo-box">
          <span class="logo-e">E</span>
          <span class="play-icon"></span>
          <span class="logo-radio">Radio</span>
        </div>
      </div>
    </div>

    <!-- LOWER THIRD NEWS STYLE -->
    <div class="news-lower-third">
      <!-- FILA SUPERIOR: PROGRAMA -->
      <div class="news-headline-bar">
        <div class="news-badge">Estás viendo</div>
        <div class="news-program-title" id="current-program">Cargando programa...</div>
      </div>

      <!-- FILA INFERIOR: TICKER + HORA + CLIMA -->
      <div class="news-ticker-bar">
        <div class="ticker-container">
          <div class="ticker-content" id="ticker-content">
            <!-- Generado por JavaScript con datos en vivo -->
            <div class="ticker-item">Cargando noticias y pronóstico...</div>
          </div>
        </div>

        <div class="news-widgets">
          <div class="clock-box" id="clock">00:00</div>
          <div class="weather-box" id="weather">-- °C</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const LATITUDE = -32.9468;
    const LONGITUDE = -60.6393;

    // GRILLA DE PROGRAMACIÓN
    const schedule = {
      0: "Madrugada ERADIO - Selección Musical",
      2: "Trasnoche Urbana",
      4: "Despertar en la Ciudad",
      6: "Mañanas de ERADIO",
      8: "ERadio TOP10",
      10: "ERADIO Noticias & Tendencias",
      12: "El Mediodía en Vivo",
      14: "Tarde de Música",
      16: "El Afternoon Show",
      18: "El Regreso de ERADIO",
      20: "Noche de Éxitos & Ranking",
      22: "ERADIO Night Session"
    };

    const dayNames = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

    function updateClockAndProgram() {
      const now = new Date();
      const utcTimestamp = now.getTime() + (now.getTimezoneOffset() * 60000);
      const argentinaOffset = -3 * 60 * 60 * 1000;
      const argentinaDate = new Date(utcTimestamp + argentinaOffset);

      const hoursNum = argentinaDate.getHours();
      const hours = String(hoursNum).padStart(2, '0');
      const minutes = String(argentinaDate.getMinutes()).padStart(2, '0');

      document.getElementById('clock').textContent = `${hours}:${minutes}`;

      const currentBlock = Math.floor(hoursNum / 2) * 2;
      const programName = schedule[currentBlock] || "Programación Regular";
      
      document.getElementById('current-program').textContent = programName;
    }

    async function updateWeatherAndTicker() {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
      
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Error al conectar con la API del clima');
        
        const data = await response.json();
        
        // Temperatura Actual
        const tempActual = Math.round(data.current.temperature_2m);
        document.getElementById('weather').textContent = `${tempActual} °C`;

        // Pronóstico
        const maxHoy = Math.round(data.daily.temperature_2m_max[0]);
        const minHoy = Math.round(data.daily.temperature_2m_min[0]);

        let forecastText = `EL TIEMPO HOY: Máx ${maxHoy}°C / Mín ${minHoy}°C`;

        // Próximos 3 días
        for (let i = 1; i <= 3; i++) {
          const date = new Date(data.daily.time[i] + 'T00:00:00');
          const dayName = dayNames[date.getDay()];
          const max = Math.round(data.daily.temperature_2m_max[i]);
          const min = Math.round(data.daily.temperature_2m_min[i]);
          forecastText += ` &nbsp;•&nbsp; ${dayName.toUpperCase()}: ${min}°C - ${max}°C`;
        }

        // Armar el ticker dinámico
        const tickerHTML = `
          <div class="ticker-item">
            Encontranos en el <span class="highlight">Canal 225 de ZipTV</span> &nbsp;•&nbsp; 
            También estamos en directo en nuestro sitio web: <span class="highlight">eradio.env.pm</span> &nbsp;•&nbsp; 
            Seguinos en Twitch: <span class="highlight">eradiorosario</span> &nbsp;•&nbsp; 
            <span class="weather-highlight">${forecastText}</span>
          </div>
          <div class="ticker-item">
            Encontranos en el <span class="highlight">Canal 225 de ZipTV</span> &nbsp;•&nbsp; 
            También estamos en directo en nuestro sitio web: <span class="highlight">eradio.env.pm</span> &nbsp;•&nbsp; 
            Seguinos en Twitch: <span class="highlight">eradiorosario</span> &nbsp;•&nbsp; 
            <span class="weather-highlight">${forecastText}</span>
          </div>
        `;

        document.getElementById('ticker-content').innerHTML = tickerHTML;

      } catch (error) {
        console.error('Error al actualizar clima/ticker:', error);
      }
    }

    updateClockAndProgram();
    setInterval(updateClockAndProgram, 1000);

    updateWeatherAndTicker();
    setInterval(updateWeatherAndTicker, 1 * 60 * 60 * 1000); // Actualiza clima cada hora
  </script>

</body>
</html>
